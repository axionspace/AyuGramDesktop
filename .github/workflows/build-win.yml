name: Build Windows

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'CMake configuration'
        required: false
        default: 'Debug'
        type: choice
        options: ['Debug', 'Release']
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  UPLOAD_ARTIFACT: "true"
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"
  BUILD_CONFIG: ${{ inputs.config || 'Debug' }}

jobs:
  # Kept separate so a failing build never throws away an hour of libraries.
  libraries:
    name: Libraries
    runs-on: windows-latest
    timeout-minutes: 200

    defaults:
      run:
        shell: cmd

    steps:
      - name: Free up disk space.
        shell: pwsh
        run: |
          $targets = @(
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\dotnet',
            'C:\Program Files\Google',
            'C:\Program Files\MongoDB',
            'C:\Program Files\MySQL',
            'C:\Program Files\R',
            'C:\Program Files\Java',
            'C:\Program Files\Microsoft\Edge',
            'C:\Program Files (x86)\Microsoft\Edge'
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              try { Remove-Item -Recurse -Force $t -ErrorAction Stop } catch { }
            }
          }
          Get-PSDrive C | ForEach-Object { "C: free = $([math]::Round($_.Free/1GB,1)) GB" }
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          if [ "$BUILD_CONFIG" = "Release" ]; then echo "release" >> CACHE_KEY.txt; fi
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-

      - name: Install ATL.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $msvc = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          $atlSrc = if ($msvc) { Join-Path $msvc.FullName "atlmfc" } else { $null }
          if (-not $atlSrc -or -not (Test-Path (Join-Path $atlSrc "include\atlbase.h"))) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $argLine = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart --nocache"
            $p = Start-Process -FilePath $installer -ArgumentList $argLine -Wait -PassThru
            Write-Output "installer exit $($p.ExitCode)"
            $msvc = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
            $atlSrc = Join-Path $msvc.FullName "atlmfc"
          }
          $atlLegacy = Join-Path $vsPath "VC\atlmfc"
          if (-not (Test-Path (Join-Path $atlLegacy "include\atlbase.h"))) {
            if (Test-Path $atlLegacy) { Remove-Item -Force -Recurse $atlLegacy }
            cmd /c mklink /J "$atlLegacy" "$atlSrc" | Out-Null
          }
          if (-not (Test-Path (Join-Path $atlLegacy "include\atlbase.h"))) { Write-Output "ATL not reachable"; exit 1 }
          Write-Output "ATL ok at $atlLegacy"
          "ATL_LIB=$atlLegacy\lib\x64" >> $env:GITHUB_ENV
          Get-ChildItem "$atlLegacy\lib\x64\atls.lib" -ErrorAction SilentlyContinue | ForEach-Object { "found $($_.FullName)" }
          $msvcLib = Join-Path $msvc.FullName "lib\x64"
          Copy-Item (Join-Path $atlSrc "lib\x64\*.lib") $msvcLib -Force
          Get-ChildItem (Join-Path $msvcLib "atls.lib") | ForEach-Object { "copied $($_.FullName)" }

      - name: Libraries.
        if: steps.cache-libs.outputs.cache-hit != 'true' || steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          set "LIB=%ATL_LIB%;%LIB%"
          if exist "%ATL_LIB%\atls.lib" (echo atls.lib present) else (echo atls.lib MISSING)
          if /I "%BUILD_CONFIG%"=="Release" (%TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6) else (%TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6)

  windows:
    name: Windows x64 Qt6
    needs: libraries
    runs-on: windows-latest
    timeout-minutes: 240

    defaults:
      run:
        shell: cmd

    steps:
      - name: Free up disk space.
        shell: pwsh
        run: |
          $targets = @(
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\dotnet',
            'C:\Program Files\Google',
            'C:\Program Files\MongoDB',
            'C:\Program Files\MySQL',
            'C:\Program Files\R',
            'C:\Program Files\Java',
            'C:\Program Files\Microsoft\Edge',
            'C:\Program Files (x86)\Microsoft\Edge'
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              try { Remove-Item -Recurse -Force $t -ErrorAction Stop } catch { }
            }
          }
          Get-PSDrive C | ForEach-Object { "C: free = $([math]::Round($_.Free/1GB,1)) GB" }
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          if [ "$BUILD_CONFIG" = "Release" ]; then echo "release" >> CACHE_KEY.txt; fi
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath -type f ! -name '*.lib' ! -name '*.a' ! -name '*.exe' ! -name '*.h' ! -name '*.hpp' ! -name '*.inc' ! -name '*.cmake' ! -name '*.pc' ! -name '*.cpp' ! -path '*/include/*' ! -path '*/objects-*' ! -path '*/cache_keys/*' ! -path '*/patches/*' ! -path '*/nv-codec-headers/*' ! -path '*/tdesktop_rust/*' ! -path '*/wallet-engine/*' -delete

      - name: Telegram Desktop configure.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat qt6 -G "Ninja Multi-Config" -D TDESKTOP_API_TEST=ON -D CMAKE_CONFIGURATION_TYPES=%BUILD_CONFIG% -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Telegram Desktop build.
        run: |
          cd %TBUILD%\%REPO_NAME%
          cmake --build out --config %BUILD_CONFIG% --parallel -- -k 0

      - name: Move artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\%BUILD_CONFIG%
          mkdir artifact
          if exist %OUT%\AyuGram.exe copy %OUT%\AyuGram.exe artifact\
          if exist %OUT%\Telegram.exe copy %OUT%\Telegram.exe artifact\
          if exist %OUT%\Updater.exe copy %OUT%\Updater.exe artifact\
          dir artifact

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: AyuGram-Windows-x64-${{ env.BUILD_CONFIG }}
          path: artifact\
          retention-days: 7
